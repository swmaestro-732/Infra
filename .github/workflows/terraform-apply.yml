name: Terraform Apply

# main 머지 시 prod 환경에 적용. apply 전 Trivy(CRITICAL) 게이트 + Environment(prod) 수동 승인.
on:
  push:
    branches: [main]
    # 인프라(terraform) 변경 때만 apply. 워크플로우/문서 변경으로는 트리거하지 않음(불필요한 apply 방지).
    paths:
      - "terraform/**"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TF_VERSION: "1.11.4"
  WORKING_DIR: terraform/environments/prod

jobs:
  # apply 전 보안 게이트: CRITICAL 이면 차단. main 기준 SARIF 도 업로드(Security 탭 베이스라인).
  security:
    name: trivy gate (CRITICAL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan (SARIF, main baseline)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-config

      - name: Gate on CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          severity: CRITICAL
          exit-code: "1"

  apply:
    name: apply (prod)
    needs: [security] # CRITICAL 미스컨피그면 apply 차단
    runs-on: ubuntu-latest
    environment: prod # Settings → Environments → prod 에서 승인자 지정 가능
    if: vars.AWS_ROLE_ARN != ''
    permissions:
      id-token: write # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false
        working-directory: ${{ env.WORKING_DIR }}

      # apply 가 user_data(LT)를 바꾸면 ASG instance refresh 가 트리거된다. apply 후 '새로 뜬'
      # 리프레시만 추적하려고, apply 직전의 최신 리프레시 ID 를 기록해 둔다(없으면 빈값).
      - name: 직전 instance refresh ID 기록
        id: prev_refresh
        run: |
          ASG=chilsami-asg # local.name-asg. ASG 이름 output 이 없어 고정(변경 시 함께 수정).
          PREV=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG" \
            --max-records 1 --query 'InstanceRefreshes[0].InstanceRefreshId' --output text 2>/dev/null || echo "")
          [ "$PREV" = "None" ] && PREV=""
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "직전 리프레시: ${PREV:-없음}"

      - name: Terraform apply
        id: apply
        working-directory: ${{ env.WORKING_DIR }}
        # pipefail 없으면 tee 가 종료코드를 삼켜서 apply 실패가 success 로 둔갑함
        run: |
          set -o pipefail
          terraform apply -auto-approve -input=false -no-color | tee apply.txt

      - name: Apply 결과 요약
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        env:
          OUTCOME: ${{ steps.apply.outcome }}
        run: |
          icon="❌"; [ "$OUTCOME" = "success" ] && icon="✅"
          # 리소스 변경 요약 한 줄 (added/changed/destroyed) 또는 에러
          result=$(grep -E "Apply complete!|No changes\.|Error:" apply.txt 2>/dev/null | tail -1 || true)
          {
            echo "## Terraform Apply (prod) $icon"
            echo ""
            echo "**결과:** ${result:-출력 없음}"
            echo ""
            echo "**커밋** \`${GITHUB_SHA:0:7}\` · **실행** @${GITHUB_ACTOR}"
            echo ""
            # 출력값(ALB DNS·RDS 엔드포인트 등)을 표로
            if [ "$OUTCOME" = "success" ] && terraform output -json > tfout.json 2>/dev/null && [ "$(jq 'length' tfout.json 2>/dev/null || echo 0)" -gt 0 ]; then
              echo "### 출력값"
              echo ""
              echo "| 키 | 값 |"
              echo "|---|---|"
              jq -r 'to_entries[] | "| `\(.key)` | `\(if .value.sensitive then "(민감값 숨김)" else (.value.value|tostring) end)` |"' tfout.json
              echo ""
            fi
            echo "<details><summary>전체 apply 로그</summary>"
            echo ""
            echo '```'
            cat apply.txt 2>/dev/null || echo "출력 없음"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # apply 성공 시, user_data 변경으로 트리거된 ASG instance refresh 를 완료까지 폴링·표시한다.
      # (terraform apply 는 리프레시 시작만 하고 완료를 기다리지 않으므로, 여기서 롤링 결과를 가시화·실패 시 CD 실패 처리.)
      - name: Instance refresh 완료까지 대기
        if: steps.apply.outcome == 'success'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          PREV_REFRESH: ${{ steps.prev_refresh.outputs.prev }}
        run: |
          set -uo pipefail
          ASG=chilsami-asg
          # instance refresh 는 EC2 Launch Template(user_data 등) 변경 때만 발생한다. 대부분의 apply
          # (network·rds·iam·monitoring 등)는 LT 를 안 건드리므로 refresh 도 없다. 이번 apply 가 LT 를
          # 변경하지 않았으면 곧바로 통과해 불필요한 감지 대기(최대 2분)를 건너뛴다.
          if ! grep -qE 'aws_launch_template\.this.*(Modif|Creat)' apply.txt 2>/dev/null; then
            {
              echo "## Instance Refresh ⏭️ 없음"
              echo ""
              echo "이번 apply 는 EC2 Launch Template(user_data) 변경이 없어 롤링 교체가 없습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 이번 apply 가 새 리프레시를 트리거했는지 최대 2분간 확인(직전 ID 와 다르거나 진행중이면 그것).
          # 진행중 판정에는 AWS 의 모든 비종료 상태(Pending·InProgress·Cancelling·RollbackInProgress)를 포함한다.
          ID=""
          for i in $(seq 1 8); do
            read -r CUR STATE _ < <(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG" \
              --max-records 1 --query 'InstanceRefreshes[0].[InstanceRefreshId,Status]' --output text 2>/dev/null || echo "None None")
            if [ "$CUR" != "None" ] && { [ "$CUR" != "$PREV_REFRESH" ] || [ "$STATE" = "InProgress" ] || [ "$STATE" = "Pending" ] || [ "$STATE" = "Cancelling" ] || [ "$STATE" = "RollbackInProgress" ]; }; then
              ID="$CUR"; break
            fi
            sleep 15
          done
          if [ -z "$ID" ]; then
            echo "## Instance Refresh ⏭️ 없음" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "이번 apply 는 user_data(부트스트랩) 변경이 없어 롤링 교체가 트리거되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "리프레시 감지: $ID — 완료까지 폴링(최대 ~30분)"
          STATUS=""; PCT=""; REASON=""
          for i in $(seq 1 60); do
            read -r STATUS PCT REASON < <(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG" \
              --instance-refresh-ids "$ID" --query 'InstanceRefreshes[0].[Status,PercentageComplete,StatusReason]' --output text 2>/dev/null || echo "Polling 0 -")
            [ "$REASON" = "None" ] && REASON=""
            [ "$PCT" = "None" ] && PCT="0"
            echo "refresh $ID: $STATUS ${PCT}% ${REASON}"
            case "$STATUS" in
              Successful|Failed|Cancelled|RollbackSuccessful|RollbackFailed) break ;;
              *) sleep 30 ;;
            esac
          done
          icon="✅"; [ "$STATUS" = "Successful" ] || icon="❌"
          {
            echo "## Instance Refresh $icon"
            echo ""
            echo "**상태:** \`${STATUS}\` (${PCT}%)"
            echo "**리프레시 ID:** \`${ID}\`"
            [ -n "$REASON" ] && echo "**사유:** ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "Successful" ]; then
            echo "::error::instance refresh 미완료/실패: ${STATUS} ${REASON}"
            exit 1
          fi

  # dev 환경 apply — prod apply 성공 후에만(dev 는 prod outputs 를 remote_state 로 읽으므로 순서 강제).
  # ASG 가 없어 instance refresh 폴링은 불필요(단일 인스턴스, 배포는 SSM). environments/dev 없으면 생략.
  apply-dev:
    name: apply (dev)
    needs: [apply]
    runs-on: ubuntu-latest
    environment: dev # Settings → Environments → dev 에서 승인자 지정 가능(미설정 시 자동 진행)
    if: vars.AWS_ROLE_ARN != ''
    permissions:
      id-token: write # OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: dev 환경 존재 확인
        id: check
        run: |
          if [ -d terraform/environments/dev ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "environments/dev 없음 — dev apply 생략"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.check.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.exists == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        if: steps.check.outputs.exists == 'true'
        run: terraform init -input=false
        working-directory: terraform/environments/dev

      - name: Terraform apply
        id: apply
        if: steps.check.outputs.exists == 'true'
        working-directory: terraform/environments/dev
        run: |
          set -o pipefail
          terraform apply -auto-approve -input=false -no-color | tee apply.txt

      - name: Apply 결과 요약
        if: always() && steps.check.outputs.exists == 'true'
        working-directory: terraform/environments/dev
        env:
          OUTCOME: ${{ steps.apply.outcome }}
        run: |
          icon="❌"; [ "$OUTCOME" = "success" ] && icon="✅"
          result=$(grep -E "Apply complete!|No changes\.|Error:" apply.txt 2>/dev/null | tail -1 || true)
          {
            echo "## Terraform Apply (dev) $icon"
            echo ""
            echo "**결과:** ${result:-출력 없음}"
            echo ""
            echo "**커밋** \`${GITHUB_SHA:0:7}\` · **실행** @${GITHUB_ACTOR}"
            echo ""
            # dev outputs (BackEnd Actions vars 등록용: AWS_DEPLOY_ROLE_ARN_DEV·DEV_ECR_REPOSITORY)
            if [ "$OUTCOME" = "success" ] && terraform output -json > tfout.json 2>/dev/null && [ "$(jq 'length' tfout.json 2>/dev/null || echo 0)" -gt 0 ]; then
              echo "### 출력값 (BackEnd dev CD 변수 등록에 사용)"
              echo ""
              echo "| 키 | 값 |"
              echo "|---|---|"
              jq -r 'to_entries[] | "| `\(.key)` | `\(if .value.sensitive then "(민감값 숨김)" else (.value.value|tostring) end)` |"' tfout.json
              echo ""
            fi
            echo "<details><summary>전체 apply 로그</summary>"
            echo ""
            echo '```'
            cat apply.txt 2>/dev/null || echo "출력 없음"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
