# Grafana 통합알림 contact point — Slack.
# url 은 Grafana 가 로드 시 SLACK_WEBHOOK_URL 환경변수로 치환한다(compose 의 grafana env → .env).
# 이 파일은 file()로 읽어(Terraform 미보간) $${...} 없이 ${SLACK_WEBHOOK_URL} 그대로 둔다 — Grafana 가 해석.
# webhook 값이 비면(시크릿 미주입) 전송만 실패(fail-soft), Grafana 기동엔 지장 없음.
# title/text 는 grafana-alerting-templates.yaml 의 chilsami.slack.* 템플릿을 쓴다(요약, 설명, 현재값, 라벨, 시작 시각, 링크).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-webhook
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          title: '{{ template "chilsami.slack.title" . }}'
          text: '{{ template "chilsami.slack.text" . }}'
        disableResolveMessage: false
