# Grafana 통합알림 규칙 — 핵심 이상징후 → Slack(알림정책 경유).
# 각 규칙은 표준 3노드(query: 쿼리 → reduce: reduce last → threshold: 임계값 비교). datasource uid: mimir(메트릭)·loki(로그).
# noDataState: 앱다운은 시리즈 소실=장애로 보아 Alerting, 급증류는 데이터 없음=정상이라 OK.
apiVersion: 1

groups:
  - orgId: 1
    name: chilsami-core
    folder: Chilsami Alerts
    interval: 1m
    rules:
      # ───────── 앱 다운 ─────────
      - uid: chilsami-app-down
        title: 앱 다운 (spring-app 스크레이프 실패)
        condition: threshold
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels: { severity: critical }
        annotations:
          summary: spring-app 인스턴스가 다운되었거나 Prometheus 스크레이프에 실패했습니다.
          description: 앱 EC2 상태, 컨테이너 기동 로그(docker logs), /actuator/prometheus 응답을 확인하세요.
        data:
          - refId: query
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'up{job="spring-app"}', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: lt, params: [1] } }] }

      # ───────── 5xx 급증 (ALB Target 5XX) ─────────
      - uid: chilsami-alb-5xx
        title: ALB 5xx 급증
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: 최근 5분간 ALB Target 5XX 응답이 임계치를 초과했습니다(배포 회귀·장애 의심).
          description: Loki 에서 같은 시각 ERROR 로그와 최근 배포 여부를 확인하세요. 현재값은 5분 합계 건수입니다.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'aws_applicationelb_httpcode_target_5_xx_count_sum', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [5] } }] }

      # ───────── 에러 로그 급증 (Loki) ─────────
      - uid: chilsami-error-log-spike
        title: 에러 로그 급증 (Loki ERROR)
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: 최근 5분간 앱 ERROR 로그가 임계치를 초과했습니다.
          description: Grafana Explore 에서 {job="app"} |= "ERROR" 로 원인 예외를 확인하세요. 현재값은 5분 건수입니다.
        data:
          - refId: query
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model: { refId: query, editorMode: code, expr: 'sum(count_over_time({job="app"} |= "ERROR" [5m]))', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200, queryType: instant }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [20] } }] }

      # ───────── 앱: 알림 유실 (기록 실패, 실행기 폐기) ─────────
      # 알림함 기록은 재시도 없는 최대 1회라 실패나 큐 포화 폐기는 곧 유실이다. 한 건이라도 생기면 알린다.
      # 에러 로그 급증 규칙은 임계값(20)이 있어 드문 유실을 놓친다. 카운터는 앱 시작 시 0 으로 등록된다.
      - uid: chilsami-notification-lost
        title: 알림 유실 (알림함 기록 실패, 실행기 폐기)
        condition: threshold
        for: 0m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: 최근 10분간 알림함 기록이 실패했거나 실행기 큐 포화로 버려졌습니다(재시도 없음, 유실).
          description: notification_record_failed_total{type}(기록 실패)와 notification_record_dropped_total{reason}(큐 포화)을 Explore 에서 나눠 보고, 같은 시각 앱 ERROR 로그로 원인을 확인하세요. 현재값은 10분 증가량입니다.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'sum by (env) (increase({__name__=~"notification_record_(failed|dropped)_total"}[10m]))', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [0] } }] }

      # ───────── 앱: 푸시 발송 (BackEnd #159 지표) ─────────
      # push_sent_total{result} 와 push_skipped_total{reason} 은 앱 시작 시 0 으로 등록된다. 배포 전에는 시리즈가 없어 OK.
      # 설정 누락(firebase) 은 모든 푸시가 막히므로 critical, 나머지 설정/메시지 오류는 warning 으로 나눈다.
      - uid: chilsami-push-failed
        title: 푸시 발송 실패 (FCM 전송 실패)
        condition: threshold
        for: 0m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: 최근 10분간 FCM 푸시 발송이 실패했습니다.
          description: 앱 ERROR 로그에서 FCM 응답 오류(토큰 만료, 권한, 쿼터)를 확인하세요. 실패 메시지가 SQS 푸시 큐의 DLQ 로 갔는지도 확인하세요. 현재값은 10분 실패 건수입니다.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'sum by (env) (increase(push_sent_total{result="failed"}[10m]))', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [0] } }] }

      - uid: chilsami-push-firebase-not-configured
        title: 푸시 건너뜀 (Firebase 미설정)
        condition: threshold
        for: 0m
        noDataState: OK
        execErrState: OK
        labels: { severity: critical }
        annotations:
          summary: Firebase 설정이 없어 푸시를 보내지 못하고 건너뛰었습니다(모든 푸시 중단).
          description: 앱 env 의 FIREBASE_CREDENTIALS_JSON(Secrets Manager 주입) 이 비었거나 잘못됐는지 확인하고 앱을 재기동하세요. 현재값은 10분 건너뜀 건수입니다.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'sum by (env, reason) (increase(push_skipped_total{reason="firebase_not_configured"}[10m]))', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [0] } }] }

      - uid: chilsami-push-misconfigured
        title: 푸시 건너뜀 (큐 미설정, 잘못된 메시지)
        condition: threshold
        for: 0m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: 푸시 큐 설정 누락 또는 잘못된 메시지로 푸시를 건너뛰었습니다.
          description: reason=queue_not_configured 이면 앱 env 의 SQS_PUSH_QUEUE_URL 을, reason=invalid_message 이면 앱 ERROR 로그와 푸시 큐 DLQ 의 메시지 형식을 확인하세요. 현재값은 10분 건너뜀 건수입니다.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'sum by (env, reason) (increase(push_skipped_total{reason=~"queue_not_configured|invalid_message"}[10m]))', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [0] } }] }

      - uid: chilsami-push-stale-dropped
        title: 푸시 건너뜀 (오래된 메시지 폐기)
        condition: threshold
        for: 0m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: 최근 30분간 너무 오래된 푸시 메시지를 발송하지 않고 버렸습니다.
          description: 푸시 컨슈머가 밀렸거나 멈췄다가 재개된 상황입니다. SQS 푸시 큐 적체(오래된 메시지 나이), 컨슈머 로그, DLQ 를 확인하세요. 현재값은 30분 폐기 건수입니다.
        data:
          - refId: query
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'sum by (env) (increase(push_skipped_total{reason="stale"}[30m]))', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [0] } }] }

      # ───────── 호스트 자원: EC2 CPU 고점 지속 ─────────
      - uid: chilsami-ec2-cpu-high
        title: EC2 CPU 고점 지속
        condition: threshold
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: EC2 CPU 사용률이 15분 이상 85%를 초과했습니다.
        data:
          - refId: query
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'aws_ec2_cpuutilization_average', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [85] } }] }

      # ───────── RDS: CPU 고점 지속 ─────────
      - uid: chilsami-rds-cpu-high
        title: RDS CPU 고점 지속
        condition: threshold
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: RDS CPU 사용률이 15분 이상 85%를 초과했습니다.
        data:
          - refId: query
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'aws_rds_cpuutilization_average', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [85] } }] }

      # ───────── RDS: 여유 스토리지 부족 ─────────
      - uid: chilsami-rds-storage-low
        title: RDS 여유 스토리지 부족
        condition: threshold
        for: 10m
        noDataState: OK
        execErrState: OK
        labels: { severity: critical }
        annotations:
          summary: RDS 여유 스토리지가 2GB 미만입니다(디스크 소진 임박).
        data:
          - refId: query
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'aws_rds_free_storage_space_average', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: lt, params: [2000000000] } }] }

      # ───────── SQS: DLQ 적재 (처리 실패 격리 발생) ─────────
      # 어느 DLQ(폴백 2종, 푸시)든 메시지가 하나라도 쌓이면 = 컨슈머가 반복 실패해 격리됨. 즉시 확인 필요.
      - uid: chilsami-sqs-dlq-not-empty
        title: SQS DLQ 적재 (폴백, 푸시 처리 실패)
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: { severity: critical }
        annotations:
          summary: SQS DLQ 에 메시지가 쌓였습니다. 컨슈머 처리 실패 격리(prod/dev 공통 규칙, tag_Name 으로 큐 구분).
          description: tag_Name 라벨의 DLQ 메시지 본문과 앱 컨슈머 ERROR 로그를 확인하고, 원인 수정 후 재처리하세요.
        data:
          - refId: query
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'max by (tag_Name) (aws_sqs_approximate_number_of_messages_visible_average{tag_Name=~"chilsami-.*-dlq"})', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [0] } }] }

      # ───────── SQS: 오래된 메시지 (컨슈머 지연·유실 임박) ─────────
      # 메인 큐의 가장 오래된 미소비 메시지 나이 > retention(4d)의 50%(=2d) 지속 → 컨슈머 지연, 방치 시 유실. 푸시 큐는 아래 별도 규칙.
      - uid: chilsami-sqs-oldest-message-age
        title: SQS 오래된 메시지 (컨슈머 지연)
        condition: threshold
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: SQS 메인 큐의 오래된 메시지가 2일을 넘었습니다. 컨슈머 지연, 유실 임박(tag_Name 으로 큐 구분).
        data:
          - refId: query
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'max by (tag_Name) (aws_sqs_approximate_age_of_oldest_message_maximum{tag_Name=~"chilsami-.*", tag_Name!~".*-dlq|.*-push"})', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [172800] } }] }

      # ───────── SQS: 푸시 큐 소비 멈춤 ─────────
      # 앱은 1시간 넘은 푸시를 버리므로 2일 기준은 의미가 없다. Firebase 키가 빠지면 소비자 자체가 뜨지 않아
      # push_skipped 카운터도 늘지 않는다. 그래서 큐에 쌓인 메시지 나이로 잡는다(YACE period 300초라 15분 단위).
      - uid: chilsami-sqs-push-stalled
        title: 푸시 큐 소비 멈춤 (오래된 메시지 15분 초과)
        condition: threshold
        for: 10m
        noDataState: OK
        execErrState: OK
        labels: { severity: critical }
        annotations:
          summary: 푸시 큐의 가장 오래된 메시지가 15분을 넘었습니다. 푸시 컨슈머가 떠 있지 않거나 멈췄습니다.
          description: 앱 env 의 FIREBASE_CREDENTIALS_JSON, SQS_PUSH_QUEUE_URL 이 둘 다 있는지(둘 중 하나라도 없으면 리스너가 뜨지 않음), 앱 ERROR 로그를 확인하세요. 1시간이 지난 메시지는 앱이 발송하지 않고 버립니다. 현재값은 초 단위 나이입니다.
        data:
          - refId: query
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'max by (tag_Name) (aws_sqs_approximate_age_of_oldest_message_maximum{tag_Name=~"chilsami-(dev-)?push"})', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [900] } }] }

      # ───────── OpenSearch: 클러스터 red ─────────
      # red = 샤드 미할당·데이터 유실 위험. 지표가 있을 때의 red 탐지(누락 탐지는 아래 노드 규칙이 담당).
      - uid: chilsami-opensearch-red
        title: OpenSearch 클러스터 red
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels: { severity: critical }
        annotations:
          summary: OpenSearch(chilsami-search) 클러스터 상태가 red 입니다 — 샤드 미할당·데이터 유실 위험.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'max(aws_es_cluster_status_red_maximum{tag_Name="chilsami-search"})', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [0] } }] }

      # ───────── OpenSearch: 노드 다운/지표 누락 ─────────
      # 클러스터가 응답하지 않으면 CloudWatch 값이 비는데, YACE 는 시리즈를 지우지 않고 NaN 을 내보낸다.
      # NaN 은 noData 에도, `< 1` 비교에도 안 걸려서 2026-10-21 장애를 놓쳤다(SCRUM-672).
      # `>= 1` 로 NaN 을 걸러내고 `or vector(0)` 로 NaN, 소실 모두 0 으로 만든다.
      # 2노드(SCRUM-675)라 기준은 2 미만: 한 대만 빠져도 알린다(복제본으로 데이터는 남지만 이중화가 깨진 상태).
      - uid: chilsami-opensearch-nodes-down
        title: OpenSearch 노드 다운/지표 누락
        condition: threshold
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels: { severity: critical }
        annotations:
          summary: OpenSearch 노드 수가 2 미만이거나 지표가 끊겼습니다. 노드 장애 또는 클러스터 소실 의심.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'min(aws_es_nodes_minimum{tag_Name="chilsami-search"} >= 1) or vector(0)', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: lt, params: [2] } }] }

      # ───────── OpenSearch: 검색 문서 수 급감 ─────────
      # 노드 교체 후 빈 클러스터로 재생성되면 시스템 인덱스(약 11건)만 남는다. 원본은 DB 라 재색인으로 복구.
      # ponytail: 고정 임계값(100). 데이터가 줄어드는 정상 시나리오가 생기면 직전 대비 비율로 바꾼다.
      - uid: chilsami-opensearch-docs-drop
        title: OpenSearch 검색 문서 수 급감
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels: { severity: critical }
        annotations:
          summary: OpenSearch 검색 가능 문서 수가 100 미만입니다. 인덱스 유실 의심, DB 재색인 필요.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'max(aws_es_searchable_documents_maximum{tag_Name="chilsami-search"})', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: lt, params: [100] } }] }

      # ───────── OpenSearch: 쓰기 차단 ─────────
      - uid: chilsami-opensearch-writes-blocked
        title: OpenSearch 쓰기 차단
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: OK
        labels: { severity: critical }
        annotations:
          summary: OpenSearch 인덱스 쓰기가 차단됐습니다 — 디스크 부족·JVM 압박 등으로 색인 중단.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'max(aws_es_cluster_index_writes_blocked_maximum{tag_Name="chilsami-search"})', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [0] } }] }

      # ───────── ElastiCache(Redis): 노드 다운/지표 누락 ─────────
      # 노드가 죽으면 AWS/ElastiCache 지표가 통째로 끊긴다 → noDataState=Alerting 이 핵심 탐지.
      # EngineCPU 는 노드가 살아 있으면 항상(0 이상) 나오므로, threshold lt 0 은 평상시 안 걸리고 No Data 때만 발화.
      # 클러스터 1개라 집계(selector 없음) — 증설 시 dimension 셀렉터 추가.
      - uid: chilsami-redis-down
        title: ElastiCache(Redis) 노드 다운/지표 누락
        condition: threshold
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels: { severity: critical }
        annotations:
          summary: ElastiCache(Redis) 지표가 끊겼습니다 — 노드 장애 의심(실시간 팬아웃 중단).
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            # YACE 는 데이터 없을 때 NaN 을 내보낸다(빈 결과 아님) → noDataState·lt 0 둘 다 안 걸림.
            # 유효 샘플(>=0)만 남기고, 비면 vector(-1) 로 치환해 lt 0 으로 누락을 경보한다(OpenSearch 와 동일 패턴).
            model: { refId: query, editorMode: code, expr: 'max(aws_elasticache_engine_cpuutilization_average >= 0) or vector(-1)', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: lt, params: [0] } }] }

      # ───────── ElastiCache(Redis): 메모리 높음 ─────────
      - uid: chilsami-redis-memory-high
        title: ElastiCache(Redis) 메모리 높음
        condition: threshold
        for: 10m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: ElastiCache(Redis) 메모리 사용률이 80%를 넘었습니다 — eviction/성능 저하 위험.
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'max(aws_elasticache_database_memory_usage_percentage_average)', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [80] } }] }

      # ───────── ElastiCache(Redis): 엔진 CPU 고점 지속 ─────────
      - uid: chilsami-redis-cpu-high
        title: ElastiCache(Redis) 엔진 CPU 고점 지속
        condition: threshold
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: ElastiCache(Redis) 엔진 CPU 가 15분 이상 85%를 초과했습니다.
        data:
          - refId: query
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'max(aws_elasticache_engine_cpuutilization_average)', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [85] } }] }

      # ───────── DocumentDB: 지표 누락/다운 ─────────
      - uid: chilsami-docdb-down
        title: DocumentDB 지표 누락/다운
        condition: threshold
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        labels: { severity: critical }
        annotations:
          summary: DocumentDB 지표가 끊겼습니다 — 인스턴스 장애 의심(채팅 메시지 저장 중단).
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: mimir
            # YACE NaN 처리 — 유효 샘플만, 비면 vector(-1) 로 치환해 lt 0 으로 누락 경보(Redis/OpenSearch 동일).
            model: { refId: query, editorMode: code, expr: 'max(aws_docdb_cpuutilization_average >= 0) or vector(-1)', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: lt, params: [0] } }] }

      # ───────── DocumentDB: CPU 고점 지속 ─────────
      - uid: chilsami-docdb-cpu-high
        title: DocumentDB CPU 고점 지속
        condition: threshold
        for: 15m
        noDataState: OK
        execErrState: OK
        labels: { severity: warning }
        annotations:
          summary: DocumentDB CPU 가 15분 이상 85%를 초과했습니다.
        data:
          - refId: query
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: mimir
            model: { refId: query, editorMode: code, expr: 'max(aws_docdb_cpuutilization_average)', instant: true, range: false, intervalMs: 15000, maxDataPoints: 43200 }
          - refId: reduce
            datasourceUid: __expr__
            model: { refId: reduce, type: reduce, expression: query, reducer: last }
          - refId: threshold
            datasourceUid: __expr__
            model: { refId: threshold, type: threshold, expression: reduce, conditions: [{ evaluator: { type: gt, params: [85] } }] }
