# Grafana 데이터소스 자동 프로비저닝 (LGTM)
apiVersion: 1

datasources:
  - name: Mimir
    type: prometheus
    uid: mimir # 프로비저닝 대시보드가 datasource 를 uid 로 참조(커뮤니티 JSON 의 DS_PROMETHEUS 치환 대상)
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # 로그 라인에서 traceId(32 hex)를 추출해 Tempo 트레이스로 클릭 이동시키는 파생 필드. 로그→트레이스.
      # 앱은 ECS JSON 구조화 로깅(LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs)이지만 trace 는 ECS 중첩 필드가 아니라
      # MDC 값이 최상위 "traceId":"<32hex>" 로 나온다(실로그 확인, SCRUM-805). 중첩 "trace":{"id"} 로 찾으면 매칭 0건.
      derivedFields:
        - name: TraceID
          matcherType: regex
          # "traceId" 키에만 앵커(다른 32hex 값 오탐 방지).
          matcherRegex: '"traceId":"([0-9A-Fa-f]{32})"'
          # Grafana 프로비저닝 YAML 은 로드 시 $VAR 를 env 로 치환한다 → $$ 로 이스케이프해야
          # 최종적으로 파생필드 값 ${__value.raw} 가 남는다(단일 $ 면 빈 값으로 치환돼 링크가 깨짐).
          url: '$${__value.raw}'
          urlDisplayLabel: View Trace
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      # 트레이스 → 관련 로그(Loki) 역방향 이동. spanID/traceID 로 로그를 필터.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
      # 트레이스로부터 서비스 그래프(메트릭은 Mimir)
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
