# Grafana 데이터소스 자동 프로비저닝 (LGTM)
apiVersion: 1

datasources:
  - name: Mimir
    type: prometheus
    uid: mimir # 프로비저닝 대시보드가 datasource 를 uid 로 참조(커뮤니티 JSON 의 DS_PROMETHEUS 치환 대상)
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
